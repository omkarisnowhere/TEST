<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Writing by Omkar Tupe." />
    <title>Blog — Omkar Tupe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="blog-page">
    <div class="grain" aria-hidden="true"></div>
    <main>
      <nav aria-label="Primary navigation">
        <a class="brand" href="index.html#top">OMKAR <span>TUPE</span></a>
        <div class="nav-links">
          <a href="index.html#about">About</a>
          <a href="index.html#work">Work</a>
          <a href="blog.html" aria-current="page">Blog</a>
          <a href="index.html#contact">Get in touch</a>
          <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme"><span aria-hidden="true">☾</span></button>
        </div>
      </nav>
      <section class="blog-hero">
        <p class="section-label">04 — BLOG</p>
        <h1>Notes on building<br /><em>useful AI.</em></h1>
        <p>Thoughts, experiments, and practical lessons from turning AI ideas into real software.</p>
        <a class="blog-medium-link" href="https://medium.com/@omkartupe36">Visit my Medium <span>↗</span></a>
      </section>
      <footer><a href="index.html#top">BACK TO HOME ↑</a></footer>
    </main>
    <script>
      const themeToggle = document.querySelector('.theme-toggle');
      const themeIcon = themeToggle.querySelector('span');
      const setTheme = (theme) => {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark-theme', isDark);
        themeIcon.textContent = isDark ? '☀' : '☾';
        themeToggle.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
        themeToggle.title = themeToggle.getAttribute('aria-label');
        try { localStorage.setItem('portfolio-theme', theme); } catch (_) {}
      };
      let preferredTheme = 'light';
      try { preferredTheme = localStorage.getItem('portfolio-theme') || preferredTheme; } catch (_) {}
      setTheme(preferredTheme);
      themeToggle.addEventListener('click', () => setTheme(document.body.classList.contains('dark-theme') ? 'light' : 'dark'));
    </script>
  </body>
</html>
